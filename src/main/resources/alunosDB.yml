spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}//$DB_NAME:alunos}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-nome: org.postgresql.Driver
    jpa:
      hibernate:
        ddl-auto: update
        show-sql: true
        properties:
          hibernate:
            format_sql: true